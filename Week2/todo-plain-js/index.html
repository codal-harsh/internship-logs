<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./scss/custom.css" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body class="bg-primary">
    <main class="container-fliud h-100 p-4">
      <div class="row h-100">
        <!-- Left Section-->
        <section class="col position-relative h-100 p-0">
          <div class="h-90 p-3 overflow-hidden">
            <h2>Todo List</h2>
            <ul
              id="todo-list"
              class="list-unstyled mt-3 d-flex flex-column gap-2 overflow-auto pb-5 h-100"
            ></ul>
            <div
              class="modal fade"
              id="exampleModal"
              tabindex="-1"
              aria-labelledby="exampleModalLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                  <form id="todo-add-form">
                    <div class="modal-header">
                      <h5 class="modal-title" id="exampleModalLabel">
                        Add Todo
                      </h5>
                      <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                      ></button>
                    </div>

                    <div class="modal-body">
                      <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input
                          type="text"
                          name="todo_title"
                          id="todo_title"
                          class="form-control"
                          placeholder="Enter title"
                          required
                        />
                      </div>

                      <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea
                          name="todo_description"
                          id="todo_description"
                          class="form-control"
                          rows="4"
                          placeholder="Enter description"
                        ></textarea>
                      </div>
                    </div>

                    <div class="modal-footer">
                      <button
                        type="button"
                        class="btn btn-primary"
                        data-bs-dismiss="modal"
                        id="add-modal-dismiss"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        class="btn btn-secondary text-white"
                      >
                        Save
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            </div>

            <div class="position-absolute m-3 end-0 top-0">
              <button
                data-bs-toggle="modal"
                data-bs-target="#exampleModal"
                class="p-1 border-0 bg-transparent rounded-circle"
              >
                <i class="ri-add-large-fill p-1 rounded-circle"></i>
              </button>
              <button
                class="p-1 border-0 rounded-circle bg-danger text-primary"
                id="delete-todo"
              >
                <i class="ri-delete-bin-4-fill p-1 rounded-circle"></i>
              </button>
            </div>
          </div>

          <div class="p-3 pt-4">
            <h2 id="date" class="fs-1">Date: 1/Jan/2000, Friday</h2>
          </div>
        </section>

        <!-- Right Section -->
        <aside
          id="mobile-popover"
          class="d-none d-md-flex flex-column col-md h-100 p-0"
        >
          <div class="p-3">
            <h2 class="">Quote of the day</h2>
            <div class="pe-5 pt-2">
              <p class="blockquote fst-italic text-justify" id="quote">
                Quote Loading
              </p>
              <p id="quote-author" class="text-end fst-italic text-lighter">
                Author Loading
              </p>
            </div>
          </div>
          <div
            class="border-top overflow-auto position-relative h-auto flex-grow-1 p-3"
          >
            <h2>Reading List</h2>
            <ul class="mt-2 overflow-auto pb-5 h-100">
              <li>1</li>
              <li>2</li>
              <li>3</li>
              <li>4</li>
              <li>5</li>
            </ul>

            <div class="position-absolute m-3 end-0 top-0">
              <button class="p-1 border-0 bg-transparent rounded-circle">
                <i class="ri-add-large-fill p-1 rounded-circle"></i>
              </button>
              <button
                class="p-1 border-0 rounded-circle bg-danger text-primary"
              >
                <i class="ri-delete-bin-4-fill p-1 rounded-circle"></i>
              </button>
            </div>
          </div>
        </aside>
      </div>
      <div class="modal" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Confirm Delete</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <p>Are you sure you want to delete?</p>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-primary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button
                type="button"
                id="confirmDeleteBtn"
                class="btn btn-danger"
              >
                Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./script.js"></script>
  </body>
</html>
