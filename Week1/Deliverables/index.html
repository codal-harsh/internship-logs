<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haemin Sunim Website</title>
    <link rel="stylesheet" href="./index.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav>
      <h1>Haemin Sunim</h1>
      <h2>HS</h2>

      <ul id="nav-menu">
        <li class="nav-links">About</li>
        <li class="nav-links">Books</li>
        <li class="nav-links">Message</li>
        <li class="nav-links">Blog</li>
        <li class="nav-links">Course</li>
        <li class="nav-links">Media</li>
      </ul>
      <button id="mobile-nav"><i class="ri-menu-line"></i></button>
    </nav>

    <section class="hero">
      <!-- HERO IMAGE -->
      <figure class="hero-image">
        <img src="./res/haimin-photo.png" alt="Haimin Sunim's photo" />
        <figcaption>Haimin Sunim's photo</figcaption>
      </figure>

      <!-- ABS DIVS -->
      <div class="floating-quotes" id="left">
        <p>Zen Meditation Teacher</p>
        <button class="cta-btn-desktop">Explore Courses <i class="ri-arrow-right-up-line"></i></button>
      </div>

      <div class="floating-quotes" id="right">
        <p>
          Best <br />
          Selling Author
        </p>

        <button class="cta-btn-desktop">Explore Books <i class="ri-arrow-right-up-line"></i></button>
      </div>

      <div class="cta">
        <button class="cta-btn rev">Explore Courses <i class="ri-arrow-right-up-line"></i></button>
        <button class="cta-btn">Explore Books <i class="ri-arrow-right-up-line"></i></button>
      </div>
    </section>

    <section class="section banner">
      <p class="banner-text">
        Being right is not important, <br />
        Being happy together is.
      </p>
    </section>

    <!-- Books -->
    <section class="section bg">Books</section>

    <!-- Testinomials -->
    <article class="section rev-bg">Reviews</article>

    <section class="section footer-banner">
      <p>WISDOM NEVER ENDS</p>
      <p>IT CARRY FORWARDS</p>
    </section>

    <!-- Footer -->
    <footer>Footer</footer>
  </body>
</html>
