version: '3.8'

services:
  api:
    build:
      context: ./next-blog-backend
      dockerfile: Dockerfile
    container_name: nest_api
    ports:
      - "4000:4000" # Changed to 4000 to avoid conflict with Next.js
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: blog_user
      DB_PASS: blog_password
      DB_NAME: blog_db
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: blog_db
      MYSQL_USER: blog_user
      MYSQL_PASSWORD: blog_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql


volumes:
  mysql_data: